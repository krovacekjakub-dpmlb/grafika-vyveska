<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vývěska – tisk</title>
<link rel="stylesheet" href="css/poster.css">
<style id="page-size">@page { size: A4 landscape; margin: 0; }</style>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #6b7280; font-family: 'DPMLB Poppins', system-ui, sans-serif; }
  .sheet { margin: 24px auto; width: max-content; box-shadow: 0 6px 30px rgba(0,0,0,.35); }
  .print-bar {
    position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; gap: 8px; align-items: center;
    background: rgba(17,24,39,.92); color: #fff; padding: 8px 10px; border-radius: 10px; font-size: 13px;
  }
  .print-bar button { font: inherit; font-weight: 600; border: 0; border-radius: 7px; padding: 8px 14px; cursor: pointer; background: #EF7C00; color: #fff; }
  .print-bar button.sec { background: #374151; }
  .print-bar .hint { max-width: 300px; line-height: 1.3; opacity: .85; font-size: 12px; }
  .missing { color: #fff; text-align: center; padding: 80px 20px; font-size: 18px; }
  .missing a { color: #FDBA74; }
  @media print {
    html, body { background: #fff !important; width: var(--pw); height: var(--ph); overflow: hidden; }
    .print-bar { display: none !important; }
    .sheet { margin: 0; box-shadow: none; }
    .poster { break-inside: avoid; page-break-after: avoid; }
  }
</style>
</head>
<body>
<div class="print-bar" role="toolbar" aria-label="Tisk">
  <span class="hint">Tisk: papír <b id="fmt-hint">A4 na šířku</b>, okraje <b>žádné</b>, měřítko <b>100&nbsp;%</b>, zapnout <b>grafiku na pozadí</b>.</span>
  <button type="button" onclick="window.print()">Tisk / uložit jako PDF</button>
  <button type="button" class="sec" onclick="history.length > 1 ? history.back() : (location.href = 'index.html')">Zpět do editoru</button>
</div>
<div class="sheet" id="sheet"></div>

<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/text.js"></script>
<script src="js/qr.js"></script>
<script src="js/map.js"></script>
<script src="js/samples.js"></script>
<script src="js/poster.js"></script>
<script src="js/print.js"></script>
</body>
</html>
